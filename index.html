<th>联系人</th><th>联系电话</th><th>合作状态</th><th>创建日期</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>暂无匹配的供应商</div></div><div class="pagination" id="pagination"></div></div></section></main></div>

<dialog class="dialog edit-drawer" id="editor" aria-labelledby="dialog-title"><form id="edit-form"><header class="dialog-header"><h2 id="dialog-title">编辑供应商</h2><button type="button" class="dialog-close" id="close" aria-label="关闭"><span class="source-close-icon"></span></button></header><div class="dialog-body"><div class="form-row"><label class="form-label" for="name">供应商名称<img class="eager-required-mark" src="source/form-assets/required.svg" alt="" width="6" height="6"></label><div class="field-control"><input class="eager-input" id="name" aria-describedby="name-error" required><p class="error" id="name-error"></p></div></div><div class="form-row"><label class="form-label" for="contact">联系人</label><div class="field-control"><input class="eager-input" id="contact"></div></div><div class="form-row"><label class="form-label" for="phone">联系电话</label><div class="field-control"><input class="eager-input" id="phone"></div></div><div id="save-demo"><label for="save-mode">模拟保存结果</label><select id="save-mode"><option value="success">成功</option><option value="failure">失败一次</option></select><p id="save-message" role="alert" hidden></p></div></div><footer class="dialog-footer"><button class="btn outline-blue" id="cancel" type="button">取消</button><button class="btn primary" id="save" type="submit">保存</button></footer></form></dialog><dialog class="dialog confirm-dialog" id="confirm"><div class="dialog-header"><h2>放弃未保存的修改？</h2></div><div class="confirm-body">当前修改未保存，放弃后将丢失。</div><footer class="dialog-footer"><button class="btn outline-blue" id="continue" type="button">继续编辑</button><button class="btn primary" id="discard" type="button">放弃修改</button></footer></dialog><dialog id="login"><form id="login-form"><h2>登录学习账号</h2><p>编辑员：editor / edit123<br>只读人员：viewer / view123</p><label for="username">账号</label><input id="username" required autocomplete="username"><label for="password">密码</label><input id="password" type="password" required autocomplete="current-password"><p id="login-error" role="alert"></p><button type="submit" class="btn primary">登录</button></form></dialog><script src="app.js"></script></body></html>
